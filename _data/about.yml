title: ""
paragraphs:
  - "I started coding as a hobby during my school days and quickly became fascinated by it. Beyond websites, custom themes, and widgets, my first real coding project was a Ren'Py game that I still remember fondly."
  - "As a child, I was obsessed with clocks, especially the ones with intricate moving parts. I'd take them apart and put them back together, which sparked my early interest in electronics and how things work."
  - "This      In my final year, I bootstrapped a B2C SaaS which was a wild experience. I learned a lot about building products, understanding user needs, and the challenges of running a business."
  - "Currently, I work at IBM as a Full-Stack Engineer, focused on building reliable, scalable systems that stand the test of data, and traffic."
  - "I have a deep passion for learning and exploring anything that piques my curiosity. 'IMAKETECH' started as a simple way to journal my projects and share my thought process with the world."