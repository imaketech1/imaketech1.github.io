name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Environment Variables
        run: |
          echo "// Config file generated by GitHub Actions" > config.js
          echo "window.CONFIG = {" >> config.js
          echo "  github: '${{ secrets.GITHUB_URL }}'," >> config.js
          echo "  linkedin: '${{ secrets.LINKEDIN_URL }}'" >> config.js
          echo "};" >> config.js
          echo "Config.js generated successfully!"
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4