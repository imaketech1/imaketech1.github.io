name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Generate config from secrets
        run: |
          # Create _data directory if it doesn't exist
          mkdir -p _data
          
          # Generate config.yml from secrets
          cat > _data/config.yml << EOF
          name: '${{ secrets.MY_NAME }}'
          imaketech_url: '${{ secrets.IMAKETECH_URL }}'
          github_url: '${{ secrets.GITHUB_URL }}'
          linkedin_url: '${{ secrets.LINKEDIN_URL }}'
          glitter_image: '/assets/images/glitter-name.gif'
          EOF
          
          echo "Config generated from secrets!"
          echo "Name: ${{ secrets.MY_NAME }}"
          
          # Show that the file was created
          cat _data/config.yml
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'  
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4